window.getCssVar = window.getCssVar || function(name, fallback) {

      var box = el[BOX[p]];

/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));

  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.62));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

      </button>

        <span>Moves:</span>
        <span id="moveCount" class="meta-value">0</span>

      </div>

<script>
  function getCssVar(name) {
    if (!name) return '';
    const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
    return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim();
  }

  // Contrast logic for neon tiles
  function contrastText(bgHex) {
    let c = (bgHex || '').trim().replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    if (c.length !== 6) return '#1a1a1a';
    const r = parseInt(c.slice(0, 2), 16);
    const g = parseInt(c.slice(2, 4), 16);
    const b = parseInt(c.slice(4, 6), 16);
    const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const L = 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
    return L > 0.45 ? '#0d130a' : '#ffffff';
  }

  // Grid Data Structure: 9 positions (0..8)
  // Each slot holds a tile object: { val: 0..8, isOn: boolean }
  let grid = [];
  let moveCount = 0;
  let isAnimating = false;
  let animationQueue = [];
  let currentAnim = null; // { tileVal, startPos, endPos, progress, duration }
  let lastTime = 0;
  let rafId = null;

  const canvas = document.getElementById('puzzleCanvas');
  const ctx = canvas.getContext('2d');
  const btnShuffle = document.getElementById('btnShuffle');
  const btnReset = document.getElementById('btnReset');
  const statusBadge = document.getElementById('statusBadge');
  const moveCountEl = document.getElementById('moveCount');
  const lightsCountEl = document.getElementById('lightsCount');

  // Initialize Solved State
  function initSolvedState() {
    grid = [];
    for (let i = 0; i < 9; i++) {
      grid.push({
        val: (i === 8) ? 0 : i + 1,
        isOn: true
      });
    }
    moveCount = 0;
    animationQueue = [];
    currentAnim = null;
    updateUI();
  }

  function getEmptyIndex() {
    return grid.findIndex(t => t.val === 0);
  }

  function getValidNeighbors(idx) {
    const row = Math.floor(idx / 3);
    const col = idx % 3;
    const neighbors = [];
    if (row > 0) neighbors.push(idx - 3);
    if (row < 2) neighbors.push(idx + 3);
    if (col > 0) neighbors.push(idx - 1);
    if (col < 2) neighbors.push(idx + 1);
    return neighbors;
  }

  function isAdjacent(idx1, idx2) {
    const r1 = Math.floor(idx1 / 3), c1 = idx1 % 3;
    const r2 = Math.floor(idx2 / 3), c2 = idx2 % 3;
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  }

  // Toggle light state of target index + its orthogonal neighbors
  function toggleLightsOut(targetIdx) {
    const targets = [targetIdx, ...getValidNeighbors(targetIdx)];
    targets.forEach(i => {
      grid[i].isOn = !grid[i].isOn;
    });
  }

  // Move tile at position `fromIdx` to empty position `toIdx`
  function applyMove(fromIdx, toIdx, isManual = true) {
    if (!isAdjacent(fromIdx, toIdx)) return false;

    // Swap tiles in grid array
    const temp = grid[fromIdx];
    grid[fromIdx] = grid[toIdx];
    grid[toIdx] = temp;

    // Toggle lights centered at the moved tile's new position
    toggleLightsOut(toIdx);

    if (isManual) {
      moveCount++;
    }
    updateUI();
    return true;
  }

  function checkVictory() {
    for (let i = 0; i < 8; i++) {
      if (grid[i].val !== i + 1) return false;
    }
    if (grid[8].val !== 0) return false;
    return grid.every(t => t.isOn);
  }

  function updateUI() {
    if (moveCountEl) moveCountEl.textContent = moveCount;
    const onCount = grid.filter(t => t.isOn).length;
    if (lightsCountEl) lightsCountEl.textContent = `${onCount}/9`;

    const victory = checkVictory();
    if (isAnimating) {
      statusBadge.className = 'status-badge is-animating';
      if (statusBadge) statusBadge.innerHTML = '<span>● Shuffling...</span>';
      btnShuffle.disabled = true;
      btnReset.disabled = true;
    } else if (victory) {
      statusBadge.className = 'status-badge is-solved';
      if (statusBadge) statusBadge.innerHTML = '<span>★ Solved!</span>';
      btnShuffle.disabled = false;
      btnReset.disabled = false;
    } else {
      statusBadge.className = 'status-badge';
      statusBadge.style.background = getCssVar('--surface-container');
      statusBadge.style.color = getCssVar('--on-surface');
      statusBadge.style.borderColor = getCssVar('--stroke-default');
      if (statusBadge) statusBadge.innerHTML = '<span>● Playing</span>';
      btnShuffle.disabled = false;
      btnReset.disabled = false;
    }
  }

  // Trigger Slow Motion Step-by-Step Shuffle
  function triggerSlowShuffle() {
    if (isAnimating) return;

    // Reset to solved base first
    initSolvedState();
    isAnimating = true;
    btnShuffle.disabled = true;
    btnReset.disabled = true;

    // Generate 15 legal random moves
    const steps = 15;
    let tempGridPos = 8; // empty pos
    let lastFrom = -1;
    const shuffleSequence = [];

    for (let s = 0; s < steps; s++) {
      const neighbors = getValidNeighbors(tempGridPos).filter(n => n !== lastFrom);
      const chosenFrom = neighbors[Math.floor(Math.random() * neighbors.length)];
      shuffleSequence.push({ from: chosenFrom, to: tempGridPos });
      lastFrom = tempGridPos;
      tempGridPos = chosenFrom;
    }

    // Queue steps with step duration
    let queueDelay = 0;
    const STEP_DURATION = 260; // ms per slide
    const PAUSE_BETWEEN = 90;   // ms pause

    shuffleSequence.forEach((move, i) => {
      setTimeout(() => {
        // Start slide animation for step
        const tileVal = grid[move.from].val;
        currentAnim = {
          fromIdx: move.from,
          toIdx: move.to,
          tileVal: tileVal,
          startTime: performance.now(),
          duration: STEP_DURATION
        };
      }, queueDelay);

      queueDelay += STEP_DURATION + PAUSE_BETWEEN;
    });

    // Complete shuffle sequence
    setTimeout(() => {
      isAnimating = false;
      moveCount = 0; // Reset player moves count for game start
      updateUI();
    }, queueDelay + 50);
  }

  // Canvas Geometry & Rendering
  function render(now) {
    if (!canvas.parentElement) return;

    const box = canvas.parentElement;
    const w = box.clientWidth || 340;
    const h = box.clientHeight || 340;
    const dpr = window.devicePixelRatio || 1;

    if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
    }

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    // Grid sizing
    const padding = 16;
    const gap = 10;
    const gridDim = Math.min(w, h) - padding * 2;
    const tileSize = (gridDim - gap * 2) / 3;
    const startX = (w - gridDim) / 2;
    const startY = (h - gridDim) / 2;

    // Resolve color tokens
    const neonBright = getCssVar('--chart-4') || '#c8f585'; // Bright yellow-green
    const darkSlate = getCssVar('--surface-container-high') || '#1c1c1c';
    const gridBg = getCssVar('--surface-dim') || '#141414';
    const strokeCol = getCssVar('--stroke-default') || '#2d2f38';
    const textDark = contrastText(neonBright);
    const textMuted = getCssVar('--on-surface-variant') || 'rgba(255,255,255,0.6)';

    // Draw Board Frame
    ctx.fillStyle = gridBg;
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(startX - 6, startY - 6, gridDim + 12, gridDim + 12, 16);
    ctx.fill();
    ctx.stroke();

    // Helper: calculate X,Y for grid index 0..8
    function getTilePos(idx) {
      const r = Math.floor(idx / 3);
      const c = idx % 3;
      return {
        x: startX + c * (tileSize + gap),
        y: startY + r * (tileSize + gap)
      };
    }

    // Process active sliding animation step
    let activeFrom = -1;
    let activeTo = -1;
    let animPos = null;

    if (currentAnim) {
      const elapsed = now - currentAnim.startTime;
      let t = Math.min(1, elapsed / currentAnim.duration);
      // Ease out cubic
      t = 1 - Math.pow(1 - t, 3);

      const pStart = getTilePos(currentAnim.fromIdx);
      const pEnd = getTilePos(currentAnim.toIdx);

      animPos = {
        x: pStart.x + (pEnd.x - pStart.x) * t,
        y: pStart.y + (pEnd.y - pStart.y) * t,
        tileVal: currentAnim.tileVal,
        isOn: grid[currentAnim.fromIdx].isOn
      };

      activeFrom = currentAnim.fromIdx;
      activeTo = currentAnim.toIdx;

      if (elapsed >= currentAnim.duration) {
        applyMove(currentAnim.fromIdx, currentAnim.toIdx, false);
        currentAnim = null;
      }
    }

    // Draw static slots & non-animating tiles
    for (let i = 0; i < 9; i++) {
      const pos = getTilePos(i);
      const tile = grid[i];

      // Empty slot placeholder
      if (tile.val === 0 || i === activeFrom) {
        ctx.fillStyle = getCssVar('--surface') || '#0f0f0f';
        ctx.strokeStyle = getCssVar('--outline') || '#727676';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(pos.x, pos.y, tileSize, tileSize, 12);
        ctx.fill();
        ctx.stroke();
        continue;
      }

      // Skip tile currently being animated (drawn in top layer)
      drawSingleTile(ctx, pos.x, pos.y, tileSize, tile.val, tile.isOn, neonBright, darkSlate, textDark, textMuted);
    }

    // Draw animating tile on top
    if (animPos) {
      drawSingleTile(ctx, animPos.x, animPos.y, tileSize, animPos.tileVal, animPos.isOn, neonBright, darkSlate, textDark, textMuted);
    }

    ctx.restore();
    rafId = requestAnimationFrame(render);
  }

  function drawSingleTile(ctx, x, y, size, val, isOn, neonBright, darkSlate, textDark, textMuted) {
    ctx.save();

    // Tile Fill & Shadow
    if (isOn) {
      ctx.fillStyle = neonBright;
      ctx.shadowColor = neonBright;
      ctx.shadowBlur = 12;
      ctx.strokeStyle = neonBright;
    } else {
      ctx.fillStyle = darkSlate;
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.strokeStyle = getCssVar('--outline') || '#727676';
    }

    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(x, y, size, size, 12);
    ctx.fill();
    ctx.stroke();

    // Reset shadow for text
    ctx.shadowBlur = 0;

    // Tile Number Typography
    ctx.fillStyle = isOn ? textDark : textMuted;
    ctx.font = `600 ${Math.floor(size * 0.42)}px var(--ff-sans, sans-serif)`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(val, x + size / 2, y + size / 2 + 1);

    // Indicator Dot for Light Status
    ctx.beginPath();
    ctx.arc(x + size - 12, y + 12, 4, 0, Math.PI * 2);
    ctx.fillStyle = isOn ? textDark : 'rgba(255,255,255,0.2)';
    ctx.fill();

    ctx.restore();
  }

  // Handle Manual User Click
  function handleCanvasClick(e) {
    if (isAnimating || currentAnim) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    const box = canvas.parentElement;
    const w = box.clientWidth || 340;
    const h = box.clientHeight || 340;

    const padding = 16;
    const gap = 10;
    const gridDim = Math.min(w, h) - padding * 2;
    const tileSize = (gridDim - gap * 2) / 3;
    const startX = (w - gridDim) / 2;
    const startY = (h - gridDim) / 2;

    // Detect tile clicked
    for (let i = 0; i < 9; i++) {
      const r = Math.floor(i / 3);
      const c = i % 3;
      const x = startX + c * (tileSize + gap);
      const y = startY + r * (tileSize + gap);

      if (clickX >= x && clickX <= x + tileSize && clickY >= y && clickY <= y + tileSize) {
        const emptyIdx = getEmptyIndex();
        if (isAdjacent(i, emptyIdx)) {
          // Trigger manual smooth slide
          currentAnim = {
            fromIdx: i,
            toIdx: emptyIdx,
            tileVal: grid[i].val,
            startTime: performance.now(),
            duration: 160
          };
          // Mark manual count update on completion inside render step
        }
        break;
      }
    }
  }

  // Event Listeners & Bootstrapping
  canvas.addEventListener('click', handleCanvasClick);
  canvas.addEventListener('keydown', (e) => {
    if (isAnimating || currentAnim) return;
    const emptyIdx = getEmptyIndex();
    const r = Math.floor(emptyIdx / 3);
    const c = emptyIdx % 3;
    let target = -1;

    if (e.key === 'ArrowUp' && r < 2) target = emptyIdx + 3;
    else if (e.key === 'ArrowDown' && r > 0) target = emptyIdx - 3;
    else if (e.key === 'ArrowLeft' && c < 2) target = emptyIdx + 1;
    else if (e.key === 'ArrowRight' && c > 0) target = emptyIdx - 1;

    if (target !== -1) {
      currentAnim = {
        fromIdx: target,
        toIdx: emptyIdx,
        tileVal: grid[target].val,
        startTime: performance.now(),
        duration: 160
      };
    }
  });

  btnShuffle.addEventListener('click', triggerSlowShuffle);
  btnReset.addEventListener('click', () => {
    if (isAnimating) return;
    initSolvedState();
  });

  // Init Game State & Render Loop
  initSolvedState();
  rafId = requestAnimationFrame(render);

  // Theme & Auto-Resize Handlers
  const applyTheme = t => {
    document.documentElement.setAttribute('data-theme', t);
    updateUI();
  };
  if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
    applyTheme('dark');
  }
  window.addEventListener('message', e => {
    if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') {
      applyTheme(e.data.theme);
    }
  });

  (function autoResize() {
    function notifyHeight() {
      const c = document.querySelector('.widget-container') || document.body;
      if (!c) return;
      const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
      window.parent.postMessage({ type: 'widget-resize', height: h }, '*');
    }
    window.addEventListener('load', () => setTimeout(notifyHeight, 120));
    new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
  })();
</script>
